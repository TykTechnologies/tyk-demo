---
services:
  mcp-mock-server:
    image: tyk-mock-mcp-server:local
    build:
      context: https://github.com/TykTechnologies/tyk-mock-mcp-server.git#main
    ports:
      - "7878:7878"
    environment:
      - PORT=7878
    networks:
      - tyk
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7878/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:2.3.0
    # Published on host loopback only: auth is disabled below, so this binding is
    # the sole guard on a backend that can spawn local processes. Never widen it.
    # 6274 is the web UI; 6275 is the sandbox used by MCP Apps.
    ports:
      - "127.0.0.1:6274:6274"
      - "127.0.0.1:6275:6275"
    environment:
      - DANGEROUSLY_OMIT_AUTH=true
      - ALLOWED_ORIGINS=http://localhost:6274,http://127.0.0.1:6274
    networks:
      - tyk
    depends_on:
      mcp-mock-server:
        condition: service_healthy
