---
global:
  # Align Prometheus scrape interval with the OTel SDKs' export interval for consistency (see OTEL_METRIC_EXPORT_INTERVAL)
  scrape_interval: 60s

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - deployment.environment.name

    # When deploying on Kubernetes, resource attributes used to identify the
    # kubernetes resources in dashboards and alerts.
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - container.name

    # When deploying on VMs, resource attributes used to identify
    # the host in dashboards and alerts.
    - host.name

    # PostgreSQL resource attributes produced by the OTel Collector PostgreSQL receiver
    # and used in dashboards and alerts.
    # See https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/postgresqlreceiver/metadata.yaml
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name

storage:
  tsdb:
    out_of_order_time_window: 30m

# SLO recording rules over the pump's standard analytics metrics; feed the
# "SLOs for APIs managed by Tyk" dashboard.
rule_files:
  - /etc/prometheus/slos.rules.yml

scrape_configs:
  # Tyk Pump's Prometheus export (tyk_http_requests_total, tyk_http_latency)
  # covers every API the gateway serves, regardless of which deployment
  # defined it. Requires a deployment that overrides the pump config with a
  # prometheus sink on :8092 (e.g. mcp-token-exchange).
  - job_name: tyk
    scrape_interval: 10s
    static_configs:
      - targets: [ "tyk-pump:8092" ]
