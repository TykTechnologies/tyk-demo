---
# Acme Support Copilot — OAuth 2.0 Token Exchange (RFC 8693) for AI agents/MCP.
# Extends the base Tyk deployment with a Keycloak IdP (realm auto-imported), the
# copilot chat app, and a generic OpenAPI->MCP tool server. Requires Tyk 5.14+ EE
# (see pre.sh). Carries no observability stack of its own: compose with the
# opentelemetry-demo deployment for traces/metrics/dashboards
# (./up.sh mcp-token-exchange opentelemetry-demo).
#
# Host-published ports (all others are internal to the tyk network):
#   Chat http://localhost:8095   Keycloak http://acme-keycloak:8280
services:
  # ---- identity provider ----------------------------------------------------
  acme-keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Single issuer for every audience: the browser resolves acme-keycloak via
      # /etc/hosts (update-hosts.sh), containers via Docker DNS. Keycloak listens
      # on 8280 so the URL is identical inside and outside the network.
      KC_HOSTNAME: http://acme-keycloak:8280
      KC_HTTP_PORT: 8280
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deployments/mcp-token-exchange/volumes/acme-keycloak/realm-acme.json:/opt/keycloak/data/import/realm-acme.json:ro
    ports:
      - 8280:8280
    networks:
      - tyk

  # ---- application ----------------------------------------------------------
  acme-chat:
    build: ./deployments/mcp-token-exchange/services/chat
    environment:
      IDP_AUTHORIZE_URL: http://acme-keycloak:8280/realms/acme/protocol/openid-connect/auth
      IDP_TOKEN_URL: http://acme-keycloak:8280/realms/acme/protocol/openid-connect/token
      CHAT_CLIENT_ID: acme-support-chat
      CHAT_REDIRECT_URI: http://localhost:8095/callback
      CHAT_SCOPES: openid customers:all
      # Force the Keycloak login screen so users can switch alice<->bob
      LOGIN_PROMPT: login
      MCP_ENDPOINT: http://tyk-gateway:8080/acme-mcp/mcp
      CHAT_LISTEN: ":8090"
      # When composed with opentelemetry-demo, the shared collector carries the
      # chat's per-tool spans (spanmetrics there has the mcp.tool dimension).
      # Standalone the host doesn't resolve and the exporter retries in the
      # background — harmless, the app is unaffected.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - 8095:8090
    networks:
      - tyk
    depends_on:
      - acme-keycloak

  acme-mcp-server:
    build: ./deployments/mcp-token-exchange/services/mcp-server
    environment:
      # The OpenAPI spec the MCP tools are derived from (one tool per operation)
      MCP_OAS_PATH: /etc/acme/acme-api.oas.json
      # Tool calls replay the exchanged bearer to the acme-api via the gateway,
      # matched by custom domain via the Host header
      UPSTREAM_BASE_URL: http://tyk-gateway:8080
      UPSTREAM_HOST: api.acme.internal
    volumes:
      - ./deployments/mcp-token-exchange/data/tyk-dashboard/acme-api.oas.json:/etc/acme/acme-api.oas.json:ro
    networks:
      - tyk

  # Override the base deployment's pump config to add a Prometheus export
  # alongside the standard Mongo pumps (the opentelemetry-demo Prometheus
  # scrapes it on tyk-pump:8092). This must extend the base service rather
  # than run as a second pump: pumps pop analytics records off Redis, so two
  # instances would split the records between them and every sink would only
  # see a share of the traffic.
  tyk-pump:
    volumes:
      - ./deployments/mcp-token-exchange/volumes/tyk-pump/pump.conf:/opt/tyk-pump/pump.conf

networks:
  tyk:
