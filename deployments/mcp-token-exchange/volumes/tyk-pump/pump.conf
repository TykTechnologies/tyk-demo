{
  "analytics_storage_type": "redis",
  "analytics_storage_config": {
    "type": "redis",
    "host": "tyk-redis",
    "port": 6379,
    "hosts": null,
    "username": "",
    "password": "",
    "database": 0,
    "optimisation_max_idle": 100,
    "optimisation_max_active": 100,
    "enable_cluster": false
  },
  "purge_delay": 2,
  "pumps": {
    "mongo-pump-aggregate": {
      "name": "mongo-pump-aggregate",
      "meta": {
        "mongo_url": "mongodb://tyk-mongo:27017/tyk_analytics",
        "use_mixed_collection": false
      }
    },
    "mongo-pump-selective": {
      "name": "mongo-pump-selective",
      "meta": {
        "mongo_url": "mongodb://tyk-mongo:27017/tyk_analytics",
        "use_mixed_collection": false
      }
    },
    "mongo-mcp": {
      "name": "mongo-mcp",
      "meta": {
        "mongo_url": "mongodb://tyk-mongo:27017/tyk_analytics",
        "collection_name": "tyk_mcp_analytics"
      }
    },
    "mongo-mcp-aggregate": {
      "name": "mongo-mcp-aggregate",
      "meta": {
        "mongo_url": "mongodb://tyk-mongo:27017/tyk_analytics",
        "use_mixed_collection": false
      }
    },
    "prometheus": {
      "type": "prometheus",
      "meta": {
        "listen_address": ":8092",
        "path": "/metrics",
        "custom_metrics": [
          {
            "name": "tyk_http_requests_total",
            "description": "Total of API requests",
            "metric_type": "counter",
            "labels": [
              "response_code",
              "api_name",
              "method",
              "api_key",
              "alias",
              "path"
            ]
          },
          {
            "name": "tyk_http_latency",
            "description": "Latency of API requests",
            "metric_type": "histogram",
            "labels": [
              "type",
              "response_code",
              "api_name",
              "method",
              "api_key",
              "alias",
              "path"
            ]
          }
        ]
      }
    }
  },
  "uptime_pump_config": {
    "collection_name": "tyk_uptime_analytics",
    "mongo_url": "mongodb://tyk-mongo:27017/tyk_analytics",
    "max_insert_batch_size_bytes": 500000,
    "max_document_size_bytes": 200000
  },
  "dont_purge_uptime_data": false,
  "statsd_connection_string": "graphite:8125"
}