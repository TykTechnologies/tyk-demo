---
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

connectors:
  # Derive RED metrics from spans. The chat emits one span per MCP tool call
  # (attribute mcp.tool, error status on failure), so this yields per-tool
  # usage/failure/latency metrics on Tyk 5.14 — before the gateway's native
  # tyk_mcp_call_* metrics arrive in 5.15. Prometheus metric names:
  # traces_span_metrics_calls_total / traces_span_metrics_duration_seconds_*.
  spanmetrics:
    histogram:
      explicit:
        buckets: [ 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s ]
    dimensions:
      - name: mcp.tool
    exemplars:
      enabled: true

exporters:
  # Traces -> Tempo (OTLP gRPC).
  otlp/tempo:
    endpoint: acme-tempo:4317
    tls:
      insecure: true
  # Metrics -> Prometheus remote-write.
  prometheusremotewrite:
    endpoint: http://acme-prometheus:9090/api/v1/write
    tls:
      insecure: true
  # Logs -> Loki OTLP ingest.
  otlphttp/loki:
    endpoint: http://acme-loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/tempo, spanmetrics ]
    metrics:
      receivers: [ otlp, spanmetrics ]
      processors: [ batch ]
      exporters: [ prometheusremotewrite ]
    logs:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlphttp/loki ]
