---
datasources:
  - name: Prometheus
    access: proxy
    type: prometheus
    # Pinned to the uid hardcoded in the SLO dashboard's panels (the legacy
    # auto-assigned uid from the Grafana version the dashboard was exported
    # from); without it, modern Grafana assigns a random uid and the
    # error-budget panels fail with "datasource not found".
    uid: PBFA97CFB590B2093
    url: http://prometheus:9090
    isDefault: true
